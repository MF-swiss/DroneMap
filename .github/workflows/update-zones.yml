name: Update DroneMap Zones

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm install

      - run: npm run update:zones

      - name: Commit changes
        run: |
          git config --global user.name "DroneMap Bot"
          git config --global user.email "bot@dronemap"
          git add .
          git commit -m "Auto-update zones" || echo "No changes"
          git push
