name: Update Drone Zones

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Update zones
        run: npx ts-node scripts/updateZones.ts

      - name: Compress zones
        run: npx ts-node scripts/compress.ts

      - name: Commit changes
        run: |
          git config user.name "DroneMap Bot"
          git config user.email "bot@dronemap"
          git add data/zones data/zones_compressed
          git commit -m "Auto-update zones" || echo "No changes"
          git push
